[calendar]
enabled                = false
dedupe_events          = false   # merge an event that appears in more than one calendar into a single entry
dedupe_ignore_patterns = []      # regexes stripped from a title before events are compared
refresh_minutes        = 15
event_date_format      = "%A %e %B"
event_time_format      = "%H:%M"

[weather]
enabled         = false
refresh_minutes = 30
unit            = "metric"      # metric | imperial
effects         = true          # visual weather effects
