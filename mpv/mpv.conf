############################
# MPV HIGH QUALITY CONFIG
# FLAC + 4K BLU-RAY REMUX
############################

######## VIDEO OUTPUT ########

vo=gpu-next
hwdec=auto-safe

# High-quality video rendering
profile=high-quality
gpu-api=auto

# HDR handling
target-colorspace-hint=yes

# No unnecessary sharpening or artificial filters
deband=no

# Frame timing
video-sync=display-resample
interpolation=no

# Maintain original aspect ratio
keepaspect=yes

######## AUDIO QUALITY ########

# Automatically select best available audio device
audio-device=auto

# Preserve source channel layout where supported
audio-channels=auto-safe

# No forced resampling
# No forced sample rate
# No equalizer
# No normalization
# No audio filters

# Preserve audio pitch
audio-pitch-correction=no

# Gapless FLAC playback
gapless-audio=yes

######## AUDIO PASSTHROUGH ########

# Enable only if using a compatible HDMI receiver
# Uncomment if you want bitstream passthrough
#audio-spdif=ac3,dts,dts-hd,eac3,truehd

######## VIDEO DECODING ########

# Allow automatic hardware decoding
hwdec=auto-safe

# Allow automatic decoder thread selection
vd-lavc-threads=0

######## SUBTITLES ########

sub-auto=fuzzy
sub-font-size=42
sub-shadow-offset=1
sub-border-size=2.0
sub-color="#FFFFFF"

######## PLAYBACK ########

save-position-on-quit=yes
watch-later-directory=~~/watch_later
resume-playback=yes

######## INTERFACE ########

osc=yes
osd-font-size=32
osd-duration=2500
border=no
